<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innerstellar - Trịnh Thăng Bình Fan Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face { font-family: 'HelveticaWorld'; src: url('./assets/fonts/HelveticaWorld-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'TPLeMajor'; src: url('./assets/fonts/TP Le Major.ttf') format('truetype'); }
        .font-helvetica { font-family: 'HelveticaWorld', sans-serif; }
        .font-major { font-family: 'TPLeMajor', serif; }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-card { opacity: 0; }
        .start-anim-card { animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .semi-circle-svg { width: 180px; height: 90px; overflow: hidden; }
        .semi-circle-bg { fill: none; stroke: rgba(255, 255, 255, 0.15); stroke-width: 12; stroke-linecap: round; }
        .semi-circle-fill { fill: none; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 188.5; stroke-dashoffset: 188.5; transition: stroke-dashoffset 1.5s ease-out; }
    </style>
</head>

<body class="text-gray-800 relative">
    
    <div class="fixed inset-0 z-[-2] bg-cover bg-center" style="background-image: url('./assets/images/Background.webp');"></div>
    <div class="fixed inset-0 z-[-1] bg-black/40 backdrop-blur-[2px]"></div>

    <!-- HERO BANNER -->
    <section id="hero" class="w-full flex flex-col items-center pt-12 md:pt-20 pb-6">
        <img src="./assets/images/logowhite.svg" alt="Trịnh Tổng Partners Logo" class="h-20 md:h-28 mb-4 object-contain">
        <img src="./assets/images/Title.svg" alt="Inner Stellar - The Light Within" class="w-11/12 max-w-4xl object-contain mb-4">
        <p class="font-helvetica text-white/80 text-base md:text-lg tracking-widest">Project by @trinhtongpartners</p>
    </section>

    <!-- THANH NAVIGATION -->
    <div class="sticky top-4 z-50 w-full flex justify-center px-4 mb-16 md:mb-24">
        <nav class="grid grid-cols-[1fr_auto_1fr] w-full max-w-5xl bg-black/50 backdrop-blur-md border border-white/20 rounded-full px-4 py-2 items-center text-white font-helvetica shadow-2xl min-h-[50px] md:min-h-[60px]">
            <div></div>
            <div class="hidden md:flex justify-center space-x-6 lg:space-x-10 text-[12px] lg:text-[15px] font-bold tracking-wider items-center uppercase">
                <a href="#story" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Giới thiệu</a>
                <a href="#overview-section" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Tiến độ quỹ</a>
                <a href="#donor-section" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Danh sách donors</a>
                <a href="#lookup-section" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Tra cứu</a>
                <span class="text-gray-400 cursor-not-allowed leading-tight text-center flex flex-col whitespace-nowrap">THU CHI <span class="text-[9px] lg:text-[10px] font-normal italic mt-0.5 capitalize">(Coming soon)</span></span>
            </div>
            <div class="flex justify-end">
                <a href="LINK_GOOGLE_FORM" target="_blank" class="bg-[#1ce1db] text-black font-bold uppercase text-xs lg:text-sm px-5 py-2.5 rounded-full hover:bg-white hover:scale-105 transition-all shadow-[0_0_15px_rgba(28,225,219,0.5)] whitespace-nowrap">Donate ih mò</a>
            </div>
        </nav>
    </div>

    <!-- STORY & PHÂN CÁCH -->
    <section id="story" class="scroll-mt-28 w-full flex flex-col items-center pb-8 md:pb-12">
        <img src="./assets/images/Story-fame.svg" alt="Story of the Inner Stellar" class="w-11/12 max-w-5xl object-contain drop-shadow-2xl mb-12">
        <img src="./assets/images/Phan cach.svg" class="w-3/4 max-w-md h-auto opacity-80" alt="Divider">
    </section>

    <!-- CHỨC NĂNG -->
    <div class="max-w-4xl mx-auto space-y-16 p-4 md:p-10 mb-[50vh]">
        
        <!-- TIẾN ĐỘ -->
        <section id="overview-section" class="scroll-mt-28 w-full flex flex-col items-center">
            
            <div class="text-center mb-8 w-full">
                <h2 class="font-major text-white text-3xl md:text-5xl tracking-wider mb-2 drop-shadow-lg">Tiến độ góp quỹ</h2>
                <div class="inline-block bg-black/60 backdrop-blur px-5 py-1.5 rounded-full border border-white/10 mt-2">
                    <p id="update-time-text" class="font-helvetica text-gray-300 text-xs md:text-sm italic">Đang cập nhật...</p>
                </div>
            </div>

            <div class="flex justify-center gap-4 mb-8 w-full">
                <button onclick="switchLayout('horizontal')" id="btn-layout-horiz" class="px-6 py-2 border-2 border-[#1ce1db] bg-[#1ce1db]/20 text-[#1ce1db] rounded-full text-sm font-bold transition-all">Ngang (Opt 2)</button>
                <button onclick="switchLayout('vertical')" id="btn-layout-vert" class="px-6 py-2 border-2 border-gray-500 text-gray-400 hover:text-white rounded-full text-sm font-bold transition-all">Dọc (Opt 1)</button>
            </div>

            <div id="overview-content" class="w-full max-w-6xl relative flex flex-col items-center min-h-[400px]">
                <div class="loader mb-4"></div> <p class="text-white">Đang tải dữ liệu tiến độ...</p>
            </div>
            
            <div class="mt-16 text-center w-full flex justify-center">
                <img src="./assets/images/Donors gift.png" alt="Quà tặng Donors" class="w-11/12 max-w-lg object-contain opacity-90 drop-shadow-2xl">
            </div>

            <div class="mt-8 text-center">
                <a href="LINK_GOOGLE_FORM" target="_blank" class="bg-[#1ce1db] text-black font-bold uppercase text-sm md:text-base px-8 py-3 rounded-full hover:bg-white hover:scale-105 transition-all shadow-[0_0_15px_rgba(28,225,219,0.5)] inline-block">Donate ih mò</a>
            </div>
        </section>

        <!-- TOP DONOR -->
        <section id="donor-section" class="scroll-mt-28 bg-black/60 backdrop-blur-md p-6 rounded-xl shadow-lg border border-white/20">
            <div class="flex gap-6 border-b border-gray-600 pb-2 mb-6">
                <button id="btn-tab-all" onclick="renderDonors('all')" class="font-helvetica text-xl font-bold text-white border-b-2 border-[#1ce1db] pb-1 uppercase">Danh sách donors</button>
            </div>
            <div id="donor-content"><div class="loader"></div> <span class="text-white">Đang tải dữ liệu...</span></div>
        </section>

        <!-- TRA CỨU -->
        <section id="lookup-section" class="scroll-mt-28 bg-black/60 backdrop-blur-md p-6 rounded-xl shadow-lg border border-white/20">
            <h2 class="font-major text-xl border-b border-gray-600 pb-2 mb-6 text-white uppercase">Tra cứu kết quả</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="phoneInput" placeholder="Nhập số điện thoại của bạn..." class="font-helvetica border-0 p-3 rounded-lg w-full max-w-sm outline-none focus:ring-2 focus:ring-[#1ce1db] bg-white/90">
                <button onclick="searchPhone()" class="bg-[#1ce1db] text-black px-6 py-2 rounded-lg hover:bg-white font-bold uppercase shadow-[0_0_10px_rgba(28,225,219,0.3)]">Tra cứu</button>
            </div>
            <div id="lookup-result" class="font-helvetica hidden border border-white/20 rounded-lg p-4 bg-white/95"></div>
        </section>

    </div> 

    <!-- NÚT CTA BÁM ĐUÔI -->
    <a href="LINK_GOOGLE_FORM" target="_blank" 
       class="fixed bottom-6 right-6 bg-pink-500 text-white font-bold uppercase tracking-wider py-3 px-6 rounded-full shadow-lg hover:bg-pink-600 hover:scale-105 transition-transform duration-300 z-50 flex items-center gap-2 animate-bounce">
        <span>💸</span> DONATE IH MÒ 😸
    </a>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyttyiTTf3yhIyCA53wuvw-pCxF8ruWSbDyOaEpXJyah2wsXB3XBHG4isp8joY-Sgfs/exec";
        const formatMoney = (amount) => Number(amount).toLocaleString('vi-VN') + "đ";

        let overviewDataGlobal = null;
        let currentLayout = 'horizontal'; 
        let animationTriggered = false;

        // Các mốc phân bổ đều đẹp mắt (12%, 38%, 64%, 90%)
        const visualStops = [12, 38, 64, 90]; 

        function calculateVisualPercentage(current, targets) {
            if(current <= 0 || !targets || targets.length < 4) return 0;
            if(current <= targets[0]) return (current / targets[0]) * visualStops[0];
            if(current <= targets[1]) return visualStops[0] + ((current - targets[0]) / (targets[1] - targets[0])) * (visualStops[1] - visualStops[0]);
            if(current <= targets[2]) return visualStops[1] + ((current - targets[1]) / (targets[2] - targets[1])) * (visualStops[2] - visualStops[1]);
            if(current <= targets[3]) return visualStops[2] + ((current - targets[2]) / (targets[3] - targets[2])) * (visualStops[3] - visualStops[2]);
            return visualStops[3]; 
        }

        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOutProgress = 1 - Math.pow(1 - progress, 3);
                obj.innerHTML = formatMoney(Math.floor(easeOutProgress * (end - start) + start)).replace('đ', '');
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerHTML = formatMoney(end).replace('đ', '');
            };
            window.requestAnimationFrame(step);
        }

        async function loadOverview() {
            try {
                const res = await fetch(API_URL + "?action=overview");
                overviewDataGlobal = await res.json();
                
                let now = new Date();
                document.getElementById('update-time-text').innerText = "Thời điểm cập nhật: " + String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0') + " " + String(now.getDate()).padStart(2, '0') + "/" + String(now.getMonth()+1).padStart(2, '0') + "/" + now.getFullYear();

                renderOverviewLayout();
                setupIntersectionObserver();
            } catch (e) { document.getElementById('overview-content').innerHTML = `<span class="text-red-500">Lỗi tải dữ liệu.</span>`; }
        }

        function switchLayout(layoutType) {
            currentLayout = layoutType;
            animationTriggered = false; 
            renderOverviewLayout();
            setupIntersectionObserver();
            
            const btnH = document.getElementById('btn-layout-horiz');
            const btnV = document.getElementById('btn-layout-vert');
            if (layoutType === 'horizontal') {
                btnH.className = "px-6 py-2 border-2 border-[#1ce1db] bg-[#1ce1db]/20 text-[#1ce1db] rounded-full text-sm font-bold transition-all";
                btnV.className = "px-6 py-2 border-2 border-gray-500 text-gray-400 hover:text-white rounded-full text-sm font-bold transition-all";
            } else {
                btnV.className = "px-6 py-2 border-2 border-[#1ce1db] bg-[#1ce1db]/20 text-[#1ce1db] rounded-full text-sm font-bold transition-all";
                btnH.className = "px-6 py-2 border-2 border-gray-500 text-gray-400 hover:text-white rounded-full text-sm font-bold transition-all";
            }
        }

        function renderOverviewLayout() {
            if (!overviewDataGlobal) return;
            const data = overviewDataGlobal;
            
            const targets = data.milestones.map(m => m.target);
            const visualProgressPct = calculateVisualPercentage(data.currentTotal, targets);
            
            const moneyStatPct = Math.min(data.moneyPercent, 100);
            const timeStatPct = Math.min(data.timePercent, 100);
            const donateDashOffset = 188.5 - (188.5 * moneyStatPct / 100);
            const timeDashOffset = 188.5 - (188.5 * timeStatPct / 100);
            
            let statsHtml = `
                <div class="text-center w-full mb-12">
                    <div class="font-major text-4xl md:text-5xl mb-10 font-bold tracking-wider drop-shadow-lg">
                        <span id="counter-current" class="text-[#1ce1db]">0</span>
                        <span class="text-white text-3xl md:text-4xl mx-1 font-light">/</span>
                        <span class="text-white">${formatMoney(data.maxTarget).replace('đ', '')}</span>
                        <span class="text-gray-300 text-lg md:text-xl font-helvetica ml-1">VNĐ</span>
                    </div>
                    
                    <div class="flex flex-row justify-center items-end gap-10 md:gap-24 font-helvetica text-base md:text-lg w-full max-w-2xl mx-auto">
                        <div class="flex flex-col items-center">
                            <div class="relative semi-circle-svg mb-2">
                                <svg viewBox="0 0 120 60" class="w-full h-full">
                                    <path d="M 10 60 A 50 50 0 0 1 110 60" class="semi-circle-bg"/>
                                    <path d="M 10 60 A 50 50 0 0 1 110 60" class="semi-circle-fill stroke-[#1ce1db]" id="chart-donate"/>
                                </svg>
                                <div class="absolute bottom-2 w-full text-center font-bold text-[#1ce1db] text-xl" id="text-pct-donate">0%</div>
                            </div>
                            <span class="text-white/90 font-medium">Tiến độ Donate</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <div class="relative semi-circle-svg mb-2">
                                <svg viewBox="0 0 120 60" class="w-full h-full">
                                    <path d="M 10 60 A 50 50 0 0 1 110 60" class="semi-circle-bg"/>
                                    <path d="M 10 60 A 50 50 0 0 1 110 60" class="semi-circle-fill stroke-pink-400" id="chart-time"/>
                                </svg>
                                <div class="absolute bottom-2 w-full text-center font-bold text-pink-400 text-xl" id="text-pct-time">0%</div>
                            </div>
                            <span class="text-white/90 font-medium">Tiến độ thời gian</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('overview-content').setAttribute('data-target-money', data.currentTotal);
            document.getElementById('overview-content').setAttribute('data-pct-money', moneyStatPct);
            document.getElementById('overview-content').setAttribute('data-pct-time', timeStatPct);
            document.getElementById('overview-content').setAttribute('data-offset-donate', donateDashOffset);
            document.getElementById('overview-content').setAttribute('data-offset-time', timeDashOffset);
            document.getElementById('overview-content').setAttribute('data-visual-progress', visualProgressPct);

            let milestonesHtml = "";
            let progressHtml = "";

            if (currentLayout === 'horizontal') {
                data.milestones.forEach((m, idx) => {
                    let pct = visualStops[idx]; 
                    milestonesHtml += `
                        <div class="absolute flex flex-col items-center -translate-x-1/2 animate-card milestone-card" style="left: ${pct}%; top: 0; animation-delay: ${(idx+1)*0.2}s">
                            <div class="text-[#1ce1db] font-helvetica text-sm md:text-lg font-bold mb-3 drop-shadow-md whitespace-nowrap">${formatMoney(m.target)}</div>
                            <img src="./assets/images/Moc.svg" class="absolute w-5 h-5 z-20 -translate-x-1/2" style="top: 28px; left: 50%;">
                            <div class="mt-11 font-helvetica bg-black/60 rounded-xl p-3 md:p-4 w-40 md:w-56 text-center border border-white/10 backdrop-blur-md shadow-2xl">
                                <p class="text-white text-[10px] md:text-xs font-bold mb-1 tracking-widest opacity-80 uppercase">Chặng ${idx+1}</p>
                                <p class="text-[#1ce1db] font-major text-base md:text-xl mb-2 drop-shadow-md capitalize">${m.name}</p>
                                <!-- Chữ hoạt động màu Hồng, hiệu ứng phát sáng mờ -->
                                <p class="text-pink-400 text-xs md:text-sm leading-snug px-1 drop-shadow-[0_0_5px_rgba(244,114,182,0.8)] animate-pulse">${m.activity}</p>
                            </div>
                        </div>
                    `;
                });

                progressHtml = `
                    <div class="relative w-full overflow-x-auto no-scrollbar pt-10 pb-4">
                        <!-- Trả lại kích thước w-full (max 1152px) để vừa khung màn hình, không bị cắt nội dung -->
                        <div class="relative w-full min-w-[900px] h-[260px] mx-auto px-10">
                            
                            <!-- Mốc 0đ và CHIẾN THÔI -->
                            <div class="absolute flex flex-col items-center -translate-x-1/2" style="left: 0%; top: 0;">
                                <div class="text-[#1ce1db] font-helvetica text-sm md:text-lg font-bold mb-3 drop-shadow-md whitespace-nowrap">0đ</div>
                                <div class="w-1.5 h-4 bg-[#1ce1db] rounded-full absolute z-20" style="top: 30px;"></div>
                                <div class="mt-14 font-major text-pink-500 text-lg md:text-xl drop-shadow-md whitespace-nowrap uppercase">Chiến thôi</div>
                            </div>

                            <div class="absolute top-[36px] left-0 right-0 h-2 bg-gray-700/80 rounded-full"></div>
                            <div id="main-bar-horiz" class="absolute top-[36px] left-0 h-2 bg-[#1ce1db] rounded-full w-0 transition-all duration-[2000ms] ease-out shadow-[0_0_15px_#1ce1db] z-10"></div>
                            ${milestonesHtml}
                            <div id="star-horiz" class="absolute top-[36px] -translate-x-1/2 -translate-y-1/2 z-30 transition-all duration-[2000ms] ease-out" style="left: 0%;">
                                <img src="./assets/images/Star bullet.svg" class="w-8 md:w-10 animate-spin" style="animation-duration: 4s;">
                            </div>
                        </div>
                    </div>
                `;
            } else {
                data.milestones.forEach((m, idx) => {
                    let pct = visualStops[idx];
                    let isEven = idx % 2 === 0; 
                    let cleanActivity = m.activity.replace(/<br\s*\/?>/gi, ' ');

                    milestonesHtml += `
                        <div class="absolute w-full flex items-start animate-card milestone-card" style="top: ${pct}%; left: 0; animation-delay: ${(idx+1)*0.2}s">
                            <img src="./assets/images/Moc.svg" class="absolute w-6 h-6 -translate-x-1/2 z-20 left-1/2" style="margin-top: -12px;">
                            <div class="w-full flex ${isEven ? 'justify-start pr-[52%]' : 'justify-end pl-[52%]'} -translate-y-[48px]">
                                <div class="font-helvetica bg-black/60 rounded-xl p-4 w-[280px] md:w-[340px] border border-white/10 backdrop-blur-md shadow-2xl text-left">
                                    <p class="text-white/80 text-xs font-bold mb-1 tracking-widest uppercase">Chặng ${idx+1}</p>
                                    <p class="text-[#1ce1db] font-major text-xl md:text-2xl mb-2 drop-shadow-md capitalize">${m.name}</p>
                                    <!-- Chữ hoạt động màu Hồng, hiệu ứng phát sáng mờ -->
                                    <p class="text-pink-400 text-sm md:text-base mb-4 whitespace-nowrap overflow-hidden text-ellipsis drop-shadow-[0_0_5px_rgba(244,114,182,0.8)] animate-pulse">${cleanActivity}</p>
                                    <div class="inline-block border border-[#1ce1db] text-[#1ce1db] rounded px-3 py-1 text-sm md:text-base font-bold shadow-[inset_0_0_8px_rgba(28,225,219,0.2)]">${formatMoney(m.target)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                progressHtml = `
                    <div class="relative w-full max-w-2xl mx-auto h-[900px] my-10">
                        <div class="relative w-full h-full">
                            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1.5 h-full bg-gray-700/80 rounded-full"></div>
                            <div id="main-bar-vert" class="absolute top-0 left-1/2 -translate-x-1/2 w-1.5 bg-[#1ce1db] rounded-full h-0 transition-all duration-[2000ms] ease-out shadow-[0_0_15px_#1ce1db] z-10"></div>
                            ${milestonesHtml}
                            <div id="star-vert" class="absolute left-1/2 -translate-x-1/2 -translate-y-1/2 z-30 transition-all duration-[2000ms] ease-out" style="top: 0%;">
                                <img src="./assets/images/Star bullet.svg" class="w-10 animate-spin" style="animation-duration: 4s;">
                            </div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('overview-content').innerHTML = statsHtml + progressHtml;
        }

        function setupIntersectionObserver() {
            const overviewSection = document.getElementById('overview-section');
            if(!overviewSection) return;

            const observer = new IntersectionObserver((entries) => {
                if(entries[0].isIntersecting && !animationTriggered) {
                    animationTriggered = true;
                    
                    const content = document.getElementById('overview-content');
                    if(!content) return;

                    const targetMoney = parseFloat(content.getAttribute('data-target-money')) || 0;
                    const pctMoney = parseFloat(content.getAttribute('data-pct-money')) || 0;
                    const pctTime = parseFloat(content.getAttribute('data-pct-time')) || 0;
                    const offsetDonate = parseFloat(content.getAttribute('data-offset-donate')) || 188.5;
                    const offsetTime = parseFloat(content.getAttribute('data-offset-time')) || 188.5;
                    const visualProgress = parseFloat(content.getAttribute('data-visual-progress')) || 0;

                    animateValue("counter-current", 0, targetMoney, 2000);
                    
                    setTimeout(() => {
                        document.getElementById('chart-donate').style.strokeDashoffset = offsetDonate;
                        document.getElementById('text-pct-donate').innerText = pctMoney.toFixed(1) + "%";
                        document.getElementById('chart-time').style.strokeDashoffset = offsetTime;
                        document.getElementById('text-pct-time').innerText = pctTime.toFixed(1) + "%";
                    }, 500);

                    setTimeout(() => {
                        document.querySelectorAll('.milestone-card').forEach(card => {
                            card.classList.add('start-anim-card');
                        });
                    }, 1000);

                    setTimeout(() => {
                        if(currentLayout === 'horizontal') {
                            document.getElementById('main-bar-horiz').style.width = visualProgress + "%";
                            document.getElementById('star-horiz').style.left = visualProgress + "%";
                        } else {
                            document.getElementById('main-bar-vert').style.height = visualProgress + "%";
                            document.getElementById('star-vert').style.top = visualProgress + "%";
                        }
                    }, 2200); 
                }
            }, { threshold: 0.15 });

            observer.observe(overviewSection);
        }

        async function loadTopDonor() { /* GIỮ NGUYÊN */ }
        function renderDonors(tab) { /* GIỮ NGUYÊN */ }
        async function searchPhone() { /* GIỮ NGUYÊN */ }
        window.onload = () => { loadOverview(); loadTopDonor(); };
    </script>
</body>
</html>
