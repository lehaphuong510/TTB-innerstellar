<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khung Test Logic - Innerstellar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-10">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <div class="text-center bg-white p-6 rounded-xl shadow">
            <h1 class="text-2xl font-bold text-blue-600">BẢN TEST CHỨC NĂNG (WIREFLOW)</h1>
        </div>

        <section class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-xl font-bold border-b pb-2 mb-4">1. OVERVIEW (Tiến độ)</h2>
            <div id="overview-content"><div class="loader"></div> Đang tải dữ liệu tiến độ...</div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-xl font-bold border-b pb-2 mb-4">2. TOP DONOR</h2>
            <div id="topdonor-content"><div class="loader"></div> Đang tải bảng xếp hạng...</div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-xl font-bold border-b pb-2 mb-4">3. TRA CỨU KẾT QUẢ</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="phoneInput" placeholder="Nhập số điện thoại của bạn..." class="border p-2 rounded w-full max-w-sm outline-none focus:ring-2 focus:ring-blue-400">
                <button onclick="searchPhone()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">Tra cứu</button>
            </div>
            <div id="lookup-result" class="hidden border rounded-lg p-4 bg-gray-50"></div>
        </section>

    </div>

    <script>
        // KIỂM TRA LẠI: Đảm bảo đường link API này là bản mới nhất đã deploy thành công!
        const API_URL = "https://script.google.com/macros/s/AKfycbyttyiTTf3yhIyCA53wuvw-pCxF8ruWSbDyOaEpXJyah2wsXB3XBHG4isp8joY-Sgfs/exec";

        const formatMoney = (amount) => Number(amount).toLocaleString('vi-VN') + "đ";

        // TẢI OVERVIEW
        async function loadOverview() {
            try {
                const res = await fetch(API_URL + "?action=overview");
                const data = await res.json();
                let html = `
                    <div class="mb-4">
                        <div class="flex justify-between mb-1"><span class="font-medium">Tiến độ Donate: ${formatMoney(data.currentTotal)} / ${formatMoney(data.maxTarget)}</span><span>${data.moneyPercent.toFixed(1)}%</span></div>
                        <div class="w-full bg-gray-200 rounded-full h-4"><div class="bg-green-500 h-4 rounded-full" style="width: ${Math.min(data.moneyPercent, 100)}%"></div></div>
                    </div>
                    <div class="mb-6">
                        <div class="flex justify-between mb-1"><span class="font-medium">Thời gian dự án đã trôi qua:</span><span>${data.timePercent.toFixed(1)}%</span></div>
                        <div class="w-full bg-gray-200 rounded-full h-4"><div class="bg-blue-500 h-4 rounded-full" style="width: ${Math.min(data.timePercent, 100)}%"></div></div>
                    </div>
                    <h3 class="font-bold mb-2">Các mốc mục tiêu:</h3><ul class="list-disc pl-5 space-y-1 text-sm">
                `;
                data.milestones.forEach(m => html += `<li><strong>${m.name}</strong> (${formatMoney(m.target)}): ${m.activity}</li>`);
                document.getElementById('overview-content').innerHTML = html + `</ul>`;
            } catch (e) { document.getElementById('overview-content').innerHTML = `<span class="text-red-500">Lỗi tải dữ liệu.</span>`; }
        }

        // TẢI TOP DONOR
        async function loadTopDonor() {
            try {
                const res = await fetch(API_URL + "?action=topdonor");
                const data = await res.json();
                let html = `<p class="text-xs text-gray-500 italic mb-4">Bảng xếp hạng được tính cho các Giao dịch chuyển khoản Donate trước: <span class="font-bold text-gray-700">${data.lastUpdate}</span></p>`;
                if(data.donors && data.donors.length > 0) {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                    data.donors.forEach((d, i) => html += `<div class="border p-3 rounded flex justify-between items-center bg-gray-50"><div><span class="font-bold mr-2 text-yellow-600">${i < 3 ? '🏆' : '#'+(i+1)}</span> <span class="font-medium">${d.nickname}</span></div><div class="font-bold text-green-600">${formatMoney(d.totalAmount)}</div></div>`);
                    html += `</div>`;
                }
                document.getElementById('topdonor-content').innerHTML = html;
            } catch (e) { document.getElementById('topdonor-content').innerHTML = `<span class="text-red-500">Lỗi tải dữ liệu.</span>`; }
        }

        // TẢI TRA CỨU
        async function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('lookup-result');
            if(!phone) { alert("Vui lòng nhập số điện thoại"); return; }

            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `<div class="loader"></div> Đang tìm kiếm...`;

            try {
                const res = await fetch(API_URL + `?action=lookup&sdt=${phone}`);
                const data = await res.json();

                if (data.status === "not_found") {
                    resultBox.innerHTML = `<p class="text-red-600 font-medium">${data.message}</p>`; return;
                }

                // XỬ LÝ: Thông tin cá nhân & Số tiền (Gộp chung vào 1 block)
                let moneyContent = "";
                if (data.donateData.history.length === 1) {
                    let h = data.donateData.history[0];
                    moneyContent = `<p><strong>Số tiền đã Donate:</strong> <span class="text-blue-600 font-bold">${formatMoney(h.submittedAmount)}</span> <span class="text-red-500 text-xs italic">${h.note}</span></p>`;
                } else {
                    moneyContent = `<table class="w-full text-sm text-left border-collapse mt-2"><tr class="bg-gray-200"><th class="border p-2">Lần</th><th class="border p-2">Số tiền ghi trong form</th><th class="border p-2">Ghi chú</th></tr>`;
                    data.donateData.history.forEach(h => {
                        moneyContent += `<tr class="${h.isDiscrepancy ? 'bg-red-50' : 'bg-white'}"><td class="border p-2">Lần ${h.turn}</td><td class="border p-2 font-medium">${formatMoney(h.submittedAmount)}</td><td class="border p-2 text-red-500 text-xs">${h.note}</td></tr>`;
                    });
                    moneyContent += `<tr class="bg-gray-100 font-bold"><td class="border p-2">TỔNG CỘNG</td><td class="border p-2 text-blue-600" colspan="2">${data.donateData.totalMessage}</td></tr></table>`;
                }

                let personalBlock = `
                    <div class="p-2 text-sm border rounded mt-1 bg-white mb-2 space-y-1">
                        <p><strong>Tên thật:</strong> ${data.fullName}</p>
                        <p><strong>Nickname:</strong> ${data.nickname}</p>
                        <p><strong>Số điện thoại:</strong> ${data.originalPhone}</p>
                        ${moneyContent}
                    </div>
                `;

                // XỬ LÝ: Bảng Danh sách quà dự kiến
                let giftHtml = "";
                if (data.giftData && data.giftData.names.length > 0) {
                    let ths = "";
                    let tds = "";
                    data.giftData.names.forEach((name, index) => {
                        ths += `<th class="border border-gray-300 p-2 min-w-[90px] text-center font-medium">${name}</th>`;
                        let hasGift = data.giftData.earned[index];
                        tds += `<td class="border border-gray-300 p-2 text-center text-lg">${hasGift ? '✅' : ''}</td>`;
                    });

                    giftHtml = `
                        <div class="mt-4 border-t pt-4">
                            <p class="font-bold text-sm uppercase text-pink-600 mb-1">DANH SÁCH QUÀ DỰ KIẾN</p>
                            <p class="text-xs text-gray-600 italic mb-2">(tính theo tổng donate của Pạt 🎀 đã được đối chiếu ngân hàng tới thời điểm hiện tại: <span class="font-bold text-blue-600">${formatMoney(data.giftData.validTotal)}</span>)</p>
                            <div class="overflow-x-auto">
                                <table class="w-full text-xs border-collapse bg-white shadow-sm">
                                    <tr class="bg-gray-100">${ths}</tr>
                                    <tr>${tds}</tr>
                                </table>
                            </div>
                        </div>
                    `;
                }

                // XỬ LÝ: Thông tin Ship quà (Chỉ còn mặc định là Ship về nhà)
                let deliveryNote = data.shippingData.deliveryNote ? data.shippingData.deliveryNote : "(không có)";
                let shipBlock = `
                    <div class="p-2 text-sm border rounded mt-1 bg-white">
                        <p><strong>SĐT người nhận:</strong> ${data.shippingData.phone}</p>
                        <p><strong>Địa chỉ:</strong> ${data.shippingData.address}</p>
                        <p><strong>Lưu ý giao hàng:</strong> ${deliveryNote}</p>
                        <hr class="my-2">
                        <p class="text-xs text-gray-500 italic">Sau khi tụi mình book đơn ship quà về cho mọi người thì thông tin Mã vận đơn, Đơn vị giao hàng, Phí dự kiến cũng sẽ nằm ở phần này nha.</p>
                        
                        ${giftHtml}
                    </div>
                `;

                // XỬ LÝ LỜI CHÀO
                let displayName = data.nickname ? data.nickname : (data.fullName ? data.fullName : "");
                let greetingName = displayName ? `<span class="text-pink-600 font-bold">${displayName}</span>` : "";

                // VẼ TOÀN BỘ KẾT QUẢ
                let html = `
                    <div class="mb-4 border-b pb-4">
                        <p class="font-medium text-lg">Xin chào Pạt 🎀 ${greetingName}, tụi mình <span class="text-pink-600 font-bold">${data.formStatus}</span>.</p>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <h3 class="font-bold bg-blue-100 p-2 rounded">THÔNG TIN CÁ NHÂN DONATE</h3>
                            ${personalBlock}
                        </div>

                        <div>
                            <h3 class="font-bold bg-blue-100 p-2 rounded">THÔNG TIN QUÀ VÀ SHIP QUÀ</h3>
                            ${shipBlock}
                        </div>

                        <div>
                            <h3 class="font-bold bg-blue-100 p-2 rounded">LƯU Ý THÊM CHO TEAM @trinhtongpartners</h3>
                            <p class="p-2 text-sm">${data.teamNote || "Không có ghi chú thêm."}</p>
                        </div>
                    </div>

                    <!-- HIGHLIGHT NOTE ZALO -->
                    <div class="mt-6 bg-yellow-100 border border-yellow-300 p-4 rounded-lg shadow-sm">
                        <p class="text-sm font-bold text-yellow-800 text-center">PẠT 🎀 NHỚ VÀO GROUP ZALO ĐỂ THEO DÕI THÔNG BÁO/ CẬP NHẬT TỪ TỤI MÌNH NHA: <a href="LINK_ZALO_CỦA_BAN_VÀO_ĐÂY" target="_blank" class="text-blue-600 underline break-all">LINK ZALO</a></p>
                    </div>

                    <!-- FOOTER HỖ TRỢ -->
                    <div class="mt-6 text-center border-t pt-4">
                        <p class="text-sm text-gray-600">Liên hệ tụi mình thông qua: <a href="LINK_THREADS_CỦA_BAN_VÀO_ĐÂY" target="_blank" class="text-blue-600 font-bold hover:underline">Acc Threads của Fansite</a> nếu có sai sót về thông tin và cần hỗ trợ nha.</p>
                        <p class="text-xs text-gray-500 font-medium text-center mt-2">Lưu ý: THỜI GIAN ĐỐI CHIẾU VỚI NGÂN HÀNG và CẬP NHẬT TRẠNG THÁI từ 21h - 23h mỗi ngày.</p>
                    </div>
                `;
                
                resultBox.innerHTML = html;
            } catch (error) { resultBox.innerHTML = `<p class="text-red-500">Đã xảy ra lỗi kết nối. Vui lòng thử lại sau.</p>`; }
        }
        window.onload = () => { loadOverview(); loadTopDonor(); };
    </script>
    <!-- NÚT CTA LƠ LỬNG GÓC DƯỚI BÊN PHẢI -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSd3bHMckxxrZeXBpa3up5eOJBA6qLmZmuw9L6XqzFDqyx-s2w/viewform?usp=dialog" target="_blank" 
       class="fixed bottom-6 right-6 bg-pink-500 text-white font-bold py-3 px-6 rounded-full shadow-lg hover:bg-pink-600 hover:scale-105 transition-transform duration-300 z-50 flex items-center gap-2 animate-bounce">
        <span>💸</span> Đóng góp ngay!
    </a>
</body>
</html>
