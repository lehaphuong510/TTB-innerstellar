<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innerstellar - Trịnh Thăng Bình Fan Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* KHAI BÁO FONT CHỮ */
        @font-face {
            font-family: 'HelveticaWorld';
            src: url('./assets/fonts/HelveticaWorld-Regular.ttf') format('truetype');
        }
        @font-face {
            font-family: 'TPLeMajor';
            src: url('./assets/fonts/TP Le Major.ttf') format('truetype');
        }
        .font-helvetica { font-family: 'HelveticaWorld', sans-serif; }
        .font-major { font-family: 'TPLeMajor', serif; }
        
        /* HIỆU ỨNG LOADING */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        html { scroll-behavior: smooth; }
    </style>
</head>

<body class="text-gray-800 bg-fixed bg-cover bg-center" style="background-image: url('./assets/images/Background.webp');">

    <!-- PHẦN 1: HERO BANNER -->
    <section id="hero" class="w-full flex flex-col items-center pt-12 md:pt-20 pb-6">
        <img src="./assets/images/logowhite.svg" alt="Trịnh Tổng Partners Logo" class="h-20 md:h-28 mb-4 object-contain">
        <img src="./assets/images/Title.svg" alt="Inner Stellar - The Light Within" class="w-11/12 max-w-4xl object-contain mb-4">
        
        <p class="font-helvetica text-white/80 text-base md:text-lg tracking-widest">
            Project by @trinhtongpartners
        </p>
    </section>

    <!-- THANH NAVIGATION (Đã fix lỗi đè chữ bằng kỹ thuật 3 cột cân bằng) -->
    <div class="sticky top-4 z-50 w-full flex justify-center px-4 mb-16 md:mb-24">
        <nav class="w-full max-w-5xl bg-black/50 backdrop-blur-md border border-white/20 rounded-full px-4 py-2 md:px-4 md:py-3 flex items-center text-white font-helvetica shadow-2xl relative">
            
            <!-- 1. Cục tàng hình bên trái để cân bằng lực với nút Donate -->
            <div class="hidden md:block w-[140px] lg:w-[170px] shrink-0"></div>

            <!-- 2. Các Menu Link được ép vào giữa tuyệt đối, thêm whitespace-nowrap để không rớt dòng -->
            <div class="hidden md:flex flex-1 justify-center space-x-3 lg:space-x-8 uppercase text-[12px] lg:text-[15px] font-bold tracking-wider items-center">
                <a href="#story" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Giới thiệu</a>
                <a href="#overview-section" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Tiến độ quỹ</a>
                <a href="#donor-section" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Danh sách donors</a>
                <a href="#lookup-section" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Tra cứu</a>
                <span class="text-gray-400 cursor-not-allowed leading-tight text-center flex flex-col whitespace-nowrap">THU CHI <span class="text-[9px] lg:text-[10px] font-normal italic capitalize mt-0.5">(Coming soon)</span></span>
            </div>
            
            <!-- 3. Nút Donate được nhốt trong khung bên phải -->
            <div class="w-full md:w-[140px] lg:w-[170px] shrink-0 flex justify-end">
                <a href="LINK_GOOGLE_FORM_CUA_BAN" target="_blank" class="bg-[#1ce1db] text-black font-bold uppercase text-xs lg:text-sm px-4 lg:px-6 py-2.5 rounded-full hover:bg-white hover:scale-105 transition-all duration-300 shadow-[0_0_15px_rgba(28,225,219,0.5)] whitespace-nowrap">
                    Donate ih mò
                </a>
            </div>
            
        </nav>
    </div>
            
            <!-- Nút Donate (Tự ép sang mép phải trên Desktop) -->
            <a href="LINK_GOOGLE_FORM_CUA_BAN" target="_blank" class="md:absolute md:right-3 lg:right-4 bg-[#1ce1db] text-black font-bold uppercase text-sm md:text-base px-6 py-2.5 md:py-3 rounded-full hover:bg-white hover:scale-105 transition-all duration-300 shadow-[0_0_15px_rgba(28,225,219,0.5)] whitespace-nowrap">
                Donate ih mò
            </a>
        </nav>
    </div>

    <!-- PHẦN 2: STORY OF THE INNER STELLAR (Đã thêm scroll-mt-28 để ko bị Nav đè) -->
    <section id="story" class="scroll-mt-28 w-full flex justify-center pb-12 md:pb-20">
        <img src="./assets/images/Story-fame.svg" alt="Story of the Inner Stellar" class="w-11/12 max-w-5xl object-contain drop-shadow-2xl">
    </section>

    <!-- PHẦN 3: CÁC KHỐI CHỨC NĂNG CŨ -->
    <!-- Đã thêm mb-[50vh] (tạo khoảng trống tàng hình dưới đáy) để cuộn được Tra cứu lên top -->
    <div class="max-w-4xl mx-auto space-y-12 p-4 md:p-10 mb-[50vh]">
        
        <!-- Khối OVERVIEW -->
        <section id="overview-section" class="scroll-mt-28 bg-white/95 backdrop-blur p-6 rounded-xl shadow-lg border border-white/20">
            <h2 class="text-xl font-bold border-b pb-2 mb-4 uppercase text-blue-900">1. OVERVIEW (Tiến độ)</h2>
            <div id="overview-content"><div class="loader"></div> Đang tải dữ liệu tiến độ...</div>
        </section>

        <!-- Khối TOP DONOR -->
        <section id="donor-section" class="scroll-mt-28 bg-white/95 backdrop-blur p-6 rounded-xl shadow-lg border border-white/20">
            <div class="flex gap-6 border-b pb-2 mb-4">
                <button id="btn-tab-all" onclick="renderDonors('all')" class="text-xl font-bold text-black border-b-2 border-black pb-1 uppercase">Danh sách</button>
                <button id="btn-tab-top" onclick="renderDonors('top')" class="text-xl font-bold text-gray-400 hover:text-black pb-1 uppercase">Top</button>
            </div>
            <div id="donor-content"><div class="loader"></div> Đang tải dữ liệu...</div>
        </section>

        <!-- Khối TRA CỨU -->
        <section id="lookup-section" class="scroll-mt-28 bg-white/95 backdrop-blur p-6 rounded-xl shadow-lg border border-white/20">
            <h2 class="text-xl font-bold border-b pb-2 mb-4 uppercase text-blue-900">3. TRA CỨU KẾT QUẢ</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="phoneInput" placeholder="Nhập số điện thoại của bạn..." class="border p-2 rounded w-full max-w-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                <button onclick="searchPhone()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-bold uppercase shadow-md">Tra cứu</button>
            </div>
            <div id="lookup-result" class="hidden border rounded-lg p-4 bg-gray-50"></div>
        </section>

    </div> 

    <!-- NÚT CTA LƠ LỬNG GÓC DƯỚI BÊN PHẢI -->
    <a href="LINK_GOOGLE_FORM_CUA_BAN" target="_blank" 
       class="fixed bottom-6 right-6 bg-pink-500 text-white font-bold uppercase tracking-wider py-3 px-6 rounded-full shadow-lg hover:bg-pink-600 hover:scale-105 transition-transform duration-300 z-50 flex items-center gap-2 animate-bounce">
        <span>💸</span> DONATE IH MÒ 😸
    </a>

    <!-- PHẦN XỬ LÝ JAVASCRIPT -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyttyiTTf3yhIyCA53wuvw-pCxF8ruWSbDyOaEpXJyah2wsXB3XBHG4isp8joY-Sgfs/exec";
        const formatMoney = (amount) => Number(amount).toLocaleString('vi-VN') + "đ";

        async function loadOverview() {
            try {
                const res = await fetch(API_URL + "?action=overview");
                const data = await res.json();
                let html = `
                    <div class="mb-4">
                        <div class="flex justify-between mb-1"><span class="font-medium">Tiến độ Donate: ${formatMoney(data.currentTotal)} / ${formatMoney(data.maxTarget)}</span><span>${data.moneyPercent.toFixed(1)}%</span></div>
                        <div class="w-full bg-gray-200 rounded-full h-4"><div class="bg-green-500 h-4 rounded-full" style="width: ${Math.min(data.moneyPercent, 100)}%"></div></div>
                    </div>
                    <div class="mb-6">
                        <div class="flex justify-between mb-1"><span class="font-medium">Thời gian dự án đã trôi qua:</span><span>${data.timePercent.toFixed(1)}%</span></div>
                        <div class="w-full bg-gray-200 rounded-full h-4"><div class="bg-blue-500 h-4 rounded-full" style="width: ${Math.min(data.timePercent, 100)}%"></div></div>
                    </div>
                    <h3 class="font-bold mb-2 text-gray-800">Các mốc mục tiêu:</h3><ul class="list-disc pl-5 space-y-1 text-sm text-gray-700">
                `;
                data.milestones.forEach(m => html += `<li><strong>${m.name}</strong> (${formatMoney(m.target)}): ${m.activity}</li>`);
                document.getElementById('overview-content').innerHTML = html + `</ul>`;
            } catch (e) { document.getElementById('overview-content').innerHTML = `<span class="text-red-500">Lỗi tải dữ liệu.</span>`; }
        }

        let donorDataGlobal = null; 

        function timeAgo(ms) {
            const seconds = Math.floor((new Date() - ms) / 1000);
            let interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " ngày trước";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " giờ trước";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " phút trước";
            return "Vừa xong";
        }

        async function loadTopDonor() {
            try {
                const res = await fetch(API_URL + "?action=topdonor");
                donorDataGlobal = await res.json();
                renderDonors('all'); 
            } catch (e) { document.getElementById('donor-content').innerHTML = `<span class="text-red-500">Lỗi tải dữ liệu.</span>`; }
        }

        function renderDonors(tab) {
            if (!donorDataGlobal) return;
            const contentBox = document.getElementById('donor-content');
            const btnTop = document.getElementById('btn-tab-top');
            const btnAll = document.getElementById('btn-tab-all');

            if (tab === 'top') {
                btnTop.className = "text-xl font-bold text-black border-b-2 border-black pb-1 uppercase";
                btnAll.className = "text-xl font-bold text-gray-400 hover:text-black pb-1 border-b-2 border-transparent uppercase";
                
                let html = `<p class="text-xs text-gray-500 italic mb-4">Bảng xếp hạng được tính cho các Giao dịch chuyển khoản Donate trước: <span class="font-bold text-gray-700">${donorDataGlobal.lastUpdate}</span></p>`;
                if(donorDataGlobal.topDonors && donorDataGlobal.topDonors.length > 0) {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                    donorDataGlobal.topDonors.forEach((d, i) => html += `<div class="border p-3 rounded flex justify-between items-center bg-gray-50 border-gray-200"><div><span class="font-bold mr-2 text-yellow-600">${i < 3 ? '🏆' : '#'+(i+1)}</span> <span class="font-medium text-gray-800">${d.nickname}</span></div><div class="font-bold text-green-600">${formatMoney(d.totalAmount)}</div></div>`);
                    html += `</div>`;
                }
                contentBox.innerHTML = html;
            } else {
                btnAll.className = "text-xl font-bold text-black border-b-2 border-black pb-1 uppercase";
                btnTop.className = "text-xl font-bold text-gray-400 hover:text-black pb-1 border-b-2 border-transparent uppercase";

                let html = `<p class="text-xs text-gray-500 italic mb-4">Đối với các khoản Donate đã được đối chiếu ngân hàng</p><div class="space-y-4">`;
                donorDataGlobal.allDonors.forEach(d => {
                    let initial = d.nickname ? d.nickname.charAt(0).toUpperCase() : "?";
                    html += `
                    <div class="flex items-center gap-4 border-b border-gray-200 pb-3 last:border-0">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center font-bold text-blue-800 shrink-0 shadow-sm">${initial}</div>
                        <div>
                            <p class="font-medium text-sm text-gray-800">${d.nickname}</p>
                            <p class="text-xs text-gray-500"><span class="font-bold text-gray-700">${formatMoney(d.amount)}</span> &middot; ${timeAgo(d.timestamp)}</p>
                        </div>
                    </div>`;
                });
                html += `</div>`;
                contentBox.innerHTML = html;
            }
        }

        async function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('lookup-result');
            if(!phone) { alert("Vui lòng nhập số điện thoại"); return; }

            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `<div class="loader"></div> Đang tìm kiếm...`;

            try {
                const res = await fetch(API_URL + `?action=lookup&sdt=${phone}`);
                const data = await res.json();

                if (data.status === "not_found") {
                    resultBox.innerHTML = `<p class="text-red-600 font-medium">${data.message}</p>`; return;
                }

                let moneyContent = "";
                if (data.donateData.history.length === 1) {
                    let h = data.donateData.history[0];
                    moneyContent = `<p><strong>Số tiền đã Donate:</strong> <span class="text-blue-600 font-bold">${formatMoney(h.submittedAmount)}</span> <span class="text-red-500 text-xs italic">${h.note}</span></p>`;
                } else {
                    moneyContent = `<table class="w-full text-sm text-left border-collapse mt-2 shadow-sm rounded-lg overflow-hidden"><tr class="bg-blue-100"><th class="border border-blue-200 p-2">Lần</th><th class="border border-blue-200 p-2">Số tiền</th><th class="border border-blue-200 p-2">Ghi chú</th></tr>`;
                    data.donateData.history.forEach(h => {
                        moneyContent += `<tr class="${h.isDiscrepancy ? 'bg-red-50' : 'bg-white'}"><td class="border border-gray-200 p-2">Lần ${h.turn}</td><td class="border border-gray-200 p-2 font-medium">${formatMoney(h.submittedAmount)}</td><td class="border border-gray-200 p-2 text-red-500 text-xs">${h.note}</td></tr>`;
                    });
                    moneyContent += `<tr class="bg-gray-100 font-bold"><td class="border border-gray-200 p-2">TỔNG CỘNG</td><td class="border border-gray-200 p-2 text-blue-600" colspan="2">${data.donateData.totalMessage}</td></tr></table>`;
                }

                let personalBlock = `
                    <div class="p-2 text-sm border border-gray-200 rounded mt-1 bg-white mb-2 space-y-1 shadow-sm">
                        <p><strong>Tên thật:</strong> ${data.fullName}</p>
                        <p><strong>Nickname:</strong> ${data.nickname}</p>
                        <p><strong>Số điện thoại:</strong> ${data.originalPhone}</p>
                        ${moneyContent}
                    </div>
                `;

                let giftHtml = "";
                if (data.giftData && data.giftData.names.length > 0) {
                    let ths = "";
                    let tds = "";
                    data.giftData.names.forEach((name, index) => {
                        ths += `<th class="border border-blue-200 p-2 min-w-[90px] text-center font-medium">${name}</th>`;
                        let hasGift = data.giftData.earned[index];
                        tds += `<td class="border border-blue-200 p-2 text-center text-lg bg-white">${hasGift ? '✅' : ''}</td>`;
                    });

                    giftHtml = `
                        <div class="mt-4 border-t border-gray-200 pt-4">
                            <p class="font-bold text-sm uppercase text-pink-600 mb-1">DANH SÁCH QUÀ DỰ KIẾN <span class="normal-case text-xs font-normal text-gray-500 ml-1">(vuốt qua trái để thấy đầy đủ hơn)</span></p>
                            <p class="text-xs text-gray-600 italic mb-2">(tính theo tổng donate đã được đối chiếu: <span class="font-bold text-blue-600">${formatMoney(data.giftData.validTotal)}</span>)</p>
                            <div class="overflow-x-auto rounded-lg shadow-sm border border-gray-200">
                                <table class="w-full text-xs border-collapse">
                                    <tr class="bg-blue-50">${ths}</tr>
                                    <tr>${tds}</tr>
                                </table>
                            </div>
                        </div>
                    `;
                }

                let deliveryNote = data.shippingData.deliveryNote ? data.shippingData.deliveryNote : "(không có)";
                let shipBlock = `
                    <div class="p-2 text-sm border border-gray-200 rounded mt-1 bg-white shadow-sm">
                        <p><strong>SĐT người nhận:</strong> ${data.shippingData.phone}</p>
                        <p><strong>Địa chỉ:</strong> ${data.shippingData.address}</p>
                        <p><strong>Lưu ý giao hàng:</strong> ${deliveryNote}</p>
                        <hr class="my-2 border-gray-200">
                        <p class="text-xs text-gray-500 italic">Sau khi tụi mình book đơn ship quà về cho mọi người thì thông tin Mã vận đơn, Đơn vị giao hàng, Phí dự kiến cũng sẽ nằm ở phần này nha.</p>
                        ${giftHtml}
                    </div>
                `;

                let displayName = data.nickname ? data.nickname : (data.fullName ? data.fullName : "");
                let greetingName = displayName ? `<span class="text-pink-600 font-bold">${displayName}</span>` : "";

                let html = `
                    <div class="mb-4 border-b border-gray-200 pb-4">
                        <p class="font-medium text-lg text-gray-800">Xin chào Pạt 🎀 ${greetingName}, tụi mình <span class="text-pink-600 font-bold">${data.formStatus}</span>.</p>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <h3 class="font-bold bg-blue-100 text-blue-900 p-2 rounded shadow-sm">THÔNG TIN CÁ NHÂN DONATE</h3>
                            ${personalBlock}
                        </div>
                        <div>
                            <h3 class="font-bold bg-blue-100 text-blue-900 p-2 rounded shadow-sm">THÔNG TIN QUÀ VÀ SHIP QUÀ</h3>
                            ${shipBlock}
                        </div>
                        <div>
                            <h3 class="font-bold bg-blue-100 text-blue-900 p-2 rounded shadow-sm">LƯU Ý THÊM CHO TEAM @trinhtongpartners</h3>
                            <p class="p-2 text-sm bg-white rounded border border-gray-200 shadow-sm mt-1">${data.teamNote || "Không có ghi chú thêm."}</p>
                        </div>
                    </div>
                    <div class="mt-6 bg-yellow-50 border border-yellow-300 p-4 rounded-lg shadow-sm">
                        <p class="text-sm font-bold text-yellow-800 text-center">PẠT 🎀 NHỚ VÀO GROUP ZALO ĐỂ THEO DÕI THÔNG BÁO TỪ TỤI MÌNH NHA: <a href="LINK_ZALO_CỦA_BAN" target="_blank" class="text-blue-600 underline break-all">LINK ZALO</a></p>
                    </div>
                    <div class="mt-6 text-center border-t border-gray-200 pt-4">
                        <p class="text-sm text-gray-600">Liên hệ qua: <a href="LINK_THREADS" target="_blank" class="text-blue-600 font-bold hover:underline">Acc Threads của Fansite</a> nếu cần hỗ trợ nha.</p>
                        <p class="text-xs text-gray-500 font-medium text-center mt-2">Lưu ý: THỜI GIAN ĐỐI CHIẾU NGÂN HÀNG từ 21h - 23h mỗi ngày.</p>
                    </div>
                `;
                
                resultBox.innerHTML = html;
            } catch (error) { resultBox.innerHTML = `<p class="text-red-500">Đã xảy ra lỗi kết nối. Vui lòng thử lại sau.</p>`; }
        }

        window.onload = () => { loadOverview(); loadTopDonor(); };
    </script>
</body>
</html>
